group = 'com.central.security'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation project(':common')
    implementation project(':request-response')

    implementation('org.springframework.boot:spring-boot-starter-web')
    implementation('org.springframework.boot:spring-boot-starter-validation')

    // Users implements UserDetails; export core API for downstream compile classpaths.
    api('org.springframework.security:spring-security-core')
    implementation('org.springframework.boot:spring-boot-starter-security')
    implementation('org.springframework.boot:spring-boot-starter-oauth2-resource-server')
    implementation('org.springframework.boot:spring-boot-starter-mail')
    implementation("com.warrenstrange:googleauth:1.5.0")
    implementation('com.auth0:java-jwt:4.5.0')
    implementation('org.springframework.boot:spring-boot-starter-data-jpa')
    implementation('org.springframework.boot:spring-boot-starter-cache')
    implementation('com.github.ben-manes.caffeine:caffeine')
    implementation('io.github.wimdeblauwe:error-handling-spring-boot-starter:5.0.0')
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0')
    runtimeOnly 'com.mysql:mysql-connector-j'
    compileOnly('org.projectlombok:lombok')
    annotationProcessor('org.projectlombok:lombok')
    testCompileOnly('org.projectlombok:lombok')
    testAnnotationProcessor('org.projectlombok:lombok')
    testImplementation('org.springframework.boot:spring-boot-starter-test')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation('io.rest-assured:rest-assured:6.0.0')
}


tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

tasks.named('test') {
    useJUnitPlatform()
}
